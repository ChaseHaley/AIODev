# Builds the AIODev package on a GitHub-hosted runner from the pushed source. Every push gets an unsigned
# package to download from the run; a v* tag, pushed by tools/release.ps1, also publishes it as a release.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.ps1 names a tagged package after its tag, so the tags must be fetched.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Odin and Zig
        shell: pwsh
        run: ./tools/toolchain.ps1 -Destination "$env:RUNNER_TEMP/toolchain" -GitHubPath

      # The release links a libghostty-vt built here from the pinned release and patches in this commit, not
      # the committed prebuilt library. Zig would otherwise target the runner's CPU; x86_64_v2 adds SSE4.2 and
      # POPCNT, which Windows 11 24H2 itself requires. The rebuilt library differs from the committed one,
      # so git is told to ignore that file; build.ps1 then still names the package after this commit.
      - name: Build libghostty-vt
        shell: pwsh
        run: |
          ./tools/build_ghostty.ps1 -Cpu x86_64_v2
          git update-index --skip-worktree vendor/ghostty/ghostty-vt-static.lib

      - name: Package
        shell: pwsh
        # build.ps1 runs in its own process: in this one its last native command, such as an untagged
        # git describe, would leave a nonzero $LASTEXITCODE that fails the step after a good build.
        run: |
          pwsh -NoProfile -File ./build.ps1 package
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 package failed.' }
          $archive = @(Get-ChildItem build -Filter 'AIODev-*-windows-x64.zip')
          if ($archive.Count -ne 1) { throw "Expected one package in build/, found $($archive.Count)." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $archive[0].Name -ne "AIODev-$env:GITHUB_REF_NAME-windows-x64.zip") {
            throw "The package $($archive[0].Name) does not carry the tag $env:GITHUB_REF_NAME."
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            build/AIODev-*-windows-x64.zip
            build/AIODev-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes list commits since the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $archive = "dist/AIODev-$env:TAG-windows-x64.zip"
          ./tools/release-notes.ps1 $env:TAG $archive dist/notes.md
          # Versions with a suffix, such as v1.0.0-beta.1, are prereleases.
          $prerelease = @(if ($env:TAG -match '-') { '--prerelease' })
          gh release create $env:TAG $archive "$archive.sha256" --verify-tag --title "AIODev $env:TAG" `
            --notes-file dist/notes.md @prerelease
